<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Spot Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>✈️ Explorador de Pontos Turísticos</h1>
        <p class="subtitle">Consumindo nossa própria API em Node.js</p>

        <div class="spot-area">
            <img src="" alt="Ponto Turístico" id="spotImage">
            <div id="spotName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Lugar Aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="spotInput"
                placeholder="Digite um lugar (ex: coliseu, torre-eiffel)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>


    <script src="./script.js"></script>

</body>
</html>
